name: Deploy mathreact to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-neumathe
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    defaults:
      run:
        working-directory: mathreact

    steps:
      - name: Check deploy secrets
        if: env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_KEY == ''
        working-directory: .
        run: |
          echo "Missing GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
          echo "Skipping deployment. Configure secrets, then run this workflow manually or push again."

      - name: Checkout repository
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mathreact/package-lock.json

      - name: Install dependencies
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        run: npm ci

      - name: Build
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        run: VITE_DATA_VERSION="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}" npm run build

      - name: Prepare deploy package
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        working-directory: .
        run: |
          rm -rf deploy-package
          mkdir deploy-package
          cp -a mathreact/dist/. deploy-package/

      - name: Verify JSON content in dist
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expected = {401:13,404:23,405:8,407:6,408:4,409:11,412:9,413:15,416:33,417:20,419:27,420:11,421:17,422:12};
          for (const [chapter, total] of Object.entries(expected)) {
            const file = `deploy-package/data/chapters/neumathe_chapter_${chapter}_raw.json`;
            const pages = JSON.parse(fs.readFileSync(file, 'utf8'));
            const questions = pages.flatMap((page) => page.data.questions);
            if (questions.length !== total) {
              throw new Error(`${file} expected ${total}, got ${questions.length}`);
            }
            for (const question of questions) {
              const text = [question.question, question.analysis, ...question.choices.map((choice) => choice.choice)].join('\n');
              if (text.includes('![')) {
                throw new Error(`${file} contains image markdown in question ${question.id}`);
              }
            }
          }
          console.log('OCR chapter JSON verified locally.');
          NODE

      - name: Clean remote web directory
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/neumathe
            rm -rf /var/www/neumathe/*

      - name: Upload build files
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: deploy-package/*
          target: /var/www/neumathe
          strip_components: 1

      - name: Upload nginx config
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: neumathe.conf
          target: /tmp

      - name: Verify deployment
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            mv /tmp/neumathe.conf /etc/nginx/sites-available/neumathe
            ln -sf /etc/nginx/sites-available/neumathe /etc/nginx/sites-enabled/neumathe
            rm -f /etc/nginx/sites-enabled/default
            test -f /var/www/neumathe/index.html
            nginx -t
            systemctl reload nginx || systemctl restart nginx
            
            echo "Verifying OCR chapter JSON on VPS..."
            if test -f /var/www/neumathe/data/chapters/neumathe_chapter_422_raw.json \
              && grep -Fq '"total": 12' /var/www/neumathe/data/chapters/neumathe_chapter_422_raw.json \
              && grep -Fq 'PDF OCR' /var/www/neumathe/data/chapters/neumathe_chapter_422_raw.json \
              && ! grep -R -Fq '![' /var/www/neumathe/data/chapters/neumathe_chapter_4*_raw.json; then
              echo "VPS OCR chapter data verified."
            else
              echo "Error: OCR chapter data missing, stale, or contains image markdown."
              exit 1
            fi
            
            echo DEPLOY_OK
